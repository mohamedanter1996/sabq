<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">سابق - لعبة أسئلة جماعية تفاعلية</title>
  <desc id="desc">صورة مشاركة للعبة سابق، مسابقات كويز جماعية وتعلم من خلال اللعب</desc>
  <rect width="1200" height="630" fill="#F8FAFC"/>
  <rect x="64" y="64" width="1072" height="502" rx="32" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <circle cx="960" cy="158" r="92" fill="#10B981" opacity="0.18"/>
  <circle cx="226" cy="494" r="118" fill="#F59E0B" opacity="0.18"/>
  <g transform="translate(846 178)">
    <rect width="170" height="170" rx="30" fill="#1E3A8A"/>
    <circle cx="85" cy="76" r="52" fill="#0F766E" opacity="0.95"/>
    <path d="M97 23 58 91h27l-13 54 49-78H92l5-44Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="120" y="198" fill="#1E3A8A" font-family="Cairo, Arial, sans-serif" font-size="86" font-weight="900">سابق</text>
  <text x="120" y="278" fill="#F59E0B" font-family="Cairo, Arial, sans-serif" font-size="46" font-weight="800">جاوب الأول... واكسب</text>
  <text x="120" y="360" fill="#1F2937" font-family="Cairo, Arial, sans-serif" font-size="34" font-weight="700">لعبة أسئلة جماعية تفاعلية للمنافسة والتعلم باللعب</text>
  <g fill="#047857" font-family="Cairo, Arial, sans-serif" font-size="28" font-weight="700">

name: Deploy Frontend to MonsterASP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/local-test-db
    paths:
      - "src/Sabq.Web/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    name: Build and deploy Angular app
    runs-on: windows-latest

    env:
      FRONTEND_DIST: ${{ github.workspace }}\src\Sabq.Web\dist\sabq-web\browser
      FRONTEND_SITE_NAME: ${{ secrets.MONSTERASP_FRONTEND_SITE_NAME }}
      FRONTEND_USERNAME: ${{ secrets.MONSTERASP_FRONTEND_USERNAME }}
      FRONTEND_PASSWORD: ${{ secrets.MONSTERASP_FRONTEND_PASSWORD }}

    defaults:
      run:
        working-directory: src/Sabq.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate deployment secrets
        shell: pwsh
        working-directory: .
        run: |
          $missing = @()
          foreach ($name in @("FRONTEND_SITE_NAME", "FRONTEND_USERNAME", "FRONTEND_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name.Replace("FRONTEND_", "MONSTERASP_FRONTEND_")
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required GitHub secrets: $($missing -join ', ')"
          }

          if ($env:FRONTEND_SITE_NAME.Trim() -notmatch "^site\d+$") {
            throw "MONSTERASP_FRONTEND_SITE_NAME must be the MonsterASP website ID, for example site55521. Do not use the public frontend domain here."
          }

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        shell: pwsh
        working-directory: .
        run: |
          if (-not (Test-Path $env:FRONTEND_DIST)) {
            throw "Frontend build output was not found: $env:FRONTEND_DIST"
          }

          if (-not (Test-Path "$env:FRONTEND_DIST\web.config")) {
            throw "web.config was not copied to the frontend build output."
          }

      - name: Deploy frontend to MonsterASP
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.MONSTERASP_FRONTEND_SITE_NAME }}
          server-computer-name: https://${{ secrets.MONSTERASP_FRONTEND_SITE_NAME }}.siteasp.net:8172
          server-username: ${{ secrets.MONSTERASP_FRONTEND_USERNAME }}
          server-password: ${{ secrets.MONSTERASP_FRONTEND_PASSWORD }}
          source-path: '\src\Sabq.Web\dist\sabq-web\browser\'
          target-delete: true
